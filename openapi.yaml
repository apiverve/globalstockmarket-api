openapi: 3.0.4
info:
  title: Global Stock Market
  description: >-
    Global Stock Market tracks share price indices across 36 countries using a
    normalized 2015 baseline. Send a two-letter country code to receive the
    latest monthly index value with the previous month's reading and direction,
    while paid plans add 1, 3, 6 and 12-month and year-to-date changes, the
    12-month high, low and average, and the last 12 monthly readings.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/globalstockmarket:
    get:
      summary: Global Stock Market
      description: >-
        Get the current or historical share price index for a specific country,
        with the previous month's reading, changes over 1 to 12 months and the
        12-month range.
      operationId: globalstockmarket
      parameters:
        - name: country
          in: query
          schema:
            type: string
          required: true
          description: ISO 2-letter country code
          example: DE
        - name: year
          in: query
          schema:
            type: integer
          required: false
          description: Year to retrieve data for (2000-present). Requires month parameter.
          example: 2023
        - name: month
          in: query
          schema:
            type: integer
          required: false
          description: Month to retrieve data for (1-12). Required when year is specified.
          example: 6
        - name: history
          in: query
          schema:
            type: boolean
          required: false
          description: Include the 12 monthly readings ending at the returned month
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  country: DE
                  countryName: Germany
                  baseline: 2015=100
                  year: 2026
                  month: 9
                  value: 159.6559
                  date: '2026-09-01'
                  previousValue: 163.2341
                  previousDate: '2026-08-01'
                  changeDirection: down
                  change1m: -2.1921
                  change3m: 2.3115
                  change6m: 6.7657
                  change12m: 5.4324
                  changeYtd: 3.4851
                  high12m: 163.2341
                  low12m: 149.5385
                  average12m: 156.1535
                  history:
                    - date: '2025-10-01'
                      value: 154.4256
                    - date: '2025-11-01'
                      value: 150.3501
                    - date: '2025-12-01'
                      value: 154.2791
                    - date: '2026-01-01'
                      value: 159.3243
                    - date: '2026-02-01'
                      value: 160.134
                    - date: '2026-03-01'
                      value: 149.5385
                    - date: '2026-04-01'
                      value: 153.3461
                    - date: '2026-05-01'
                      value: 156.074
                    - date: '2026-06-01'
                      value: 156.0489
                    - date: '2026-07-01'
                      value: 157.4312
                    - date: '2026-08-01'
                      value: 163.2341
                    - date: '2026-09-01'
                      value: 159.6559
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
